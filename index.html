function sourceInfo(a){
 const profile=window.OpenLensPublisherProfiles?.lookup(a)||null;
 if(profile)return {name:profile.name,ownership:profile.owner||'Eigendom niet geverifieerd',
  kind:profile.type||'Uitgever',url:profile.ownershipSource||null,ownershipReviewed:!!profile.owner};
 let raw=(a.domain||a.source||'Unknown outlet').toLowerCase();

 return known||{name:fallback,ownership:'Eigendom nog niet beoordeeld',kind:'Niet geclassificeerd',url:null}

const commonStop=new Set('a an the to for and or in on at of with from about as by is are was were be has have had will would could should after before over under into amid more new latest live update updates today yesterday says say said report reporting reports how why what when where who than this that those these amid during against may near around across via not no it its their his her they she he we our us you your two three four one now all up out off EU US UK world global'.toLowerCase().split(' '));
function tokens(s){return [...new Set(String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').match(/[\p{L}\p{N}]{3,}/gu)||[])].filter(x=>!commonStop.has(x)&&!/^\d{1,2}$/.test(x))}
function similarity(a,b){const A=tokens(a),B=tokens(b);let overlap=A.filter(x=>B.includes(x)).length;return overlap/Math.max(2,Math.min(A.length,B.length))}
function storyTopic(s){let t=s.toLowerCase();
if(/\b(gaza|rafah|khan younis)\b/.test(t))return 'Gaza';
if(/\b(ukraine|ukrainian|kyiv|zelensky|zelenskyy)\b/.test(t))return 'Ukraine';
if(/\b(tweede kamer|eerste kamer|nederlandse politiek|dutch parliament|dutch cabinet|den haag|kabinet|formatie)\b/.test(t))return 'Dutch national politics';
if(/\b(migration|immigration|migrants|asylum|refugees|migratie|asiel|vluchtelingen)\b/.test(t))return 'Migration';
if(/\b(middle east|iran|lebanon|syria)\b/.test(t))return 'Middle East';
if(/\b(european commission|european parliament|eu policy|eu regulation)\b/.test(t))return 'EU policy';
if(/climat|environment|flood|emissions|energy|heatwave|carbon/.test(t))return 'Climate';if(/ai |artificial intelligence|technology|tech |cyber|chip|software|digital/.test(t))return 'Technology';if(/inflation|econom|market|bank|trade|business|tariff|growth/.test(t))return 'Business';if(/health|hospital|medicine|disease|vaccine|medical/.test(t))return 'Health';if(/europe|eu |european|commission|brussels/.test(t))return 'Europe';if(/elect|parliament|congress|president|government|vote|minister|politic/.test(t))return 'Politics';return 'World'}
function contentType(title){let t=title.toLowerCase();if(/\b(opinion|editorial|op-ed|commentary|columnist|my view|guest essay|perspective)\b/.test(t))return 'Opinion signal';if(/\b(analysis|explainer|what to know|what it means|why it matters)\b/.test(t))return 'Analysis signal';return 'Type unknown'}
const demoStories=[
{key:'demo-green',topic:'Climate',headline:'International climate talks examine a new financing framework',description:'Illustrative scenario: different headlines can stress funding, accountability, or implementation. No real event or publisher article is asserted here.',articles:[['Civic Wire','Climate talks center on funding framework for poorer countries'],['Global Desk','Delegates debate how proposed climate financing would be monitored'],['The Public Ledger','New financing framework raises questions over implementation']],terms:['financing framework','implementation requirements','oversight questions']},

// Geographical SUBJECT classification (not the publisher's country or the feed language).
// Explicit event/location clues win; a topic feed is only the fallback when location is unclear.
const NL_NEWS_TOPICS=new Set(['netherlands','dutch-politics','local-government','housing','public-finances','labor','healthcare-nl','education','agriculture','climate-energy','mobility','rule-of-law','social-policy','belgium-benelux']);
const EU_NEWS_TOPICS=new Set(['europe','eu-policy','eu-institutions','digital-policy']);
function classifyNewsRegion(title='',discovery='',provided=null,topic=state.topic){
 const t=String(title).toLowerCase().normalize('NFKC');
 const nl=/\b(nederland|nederlandse|nederlands|dutch|tweede kamer|eerste kamer|den haag|binnenhof|kabinet|rijksoverheid|staatssecretaris|provinciale staten|gemeenteraad|amsterdam|rotterdam|utrecht|eindhoven|groningen|stikstof|woningcorporatie|zorgpremie|belastingdienst|vlaanderen|belgi[eë]|belgium|benelux)\b/i.test(t);
 const eu=/\b(europese unie|european union|european commission|europese commissie|european parliament|europees parlement|european council|europese raad|european central bank|europese centrale bank|eu-lidstaten|eu member states|eu-wetgeving|eu regulation|eu directive|ai act|digital services act|digital markets act|eur-lex|euobserver|euractiv)\b/i.test(t);
 const world=/\b(oekra[iï]ne|ukraine|kyiv|kiev|gaza|rafah|israel|iran|syria|syri[eë]|lebanon|libanon|china|chinese|taiwan|india|indiase|japan|japanese|russia|rusland|moskou|moscow|verenigde staten|united states|washington|white house|trump|biden|united nations|verenigde naties|nato|navo|middle east|midden-oosten|afrika|africa|zuid-amerika|south america)\b/i.test(t);
 // EU policy about the Netherlands is an EU story; likewise a clearly identified NL
 // local implementation is Dutch unless EU legislation is the main explicit subject.
 if(eu||/\b(eu|europese wetgeving|european legislation|brussels regulation|eu-begroting|eu budget)\b/i.test(t))return 'eu';
 if(nl&&!world)return 'nl';
 if(world&&!nl)return 'world';
 if(nl&&world)return 'world'; // cross-border events are not automatically domestic
 if(provided==='nl'||provided==='eu'||provided==='world')return provided;
 if(EU_NEWS_TOPICS.has(topic))return 'eu';
 if(NL_NEWS_TOPICS.has(topic))return 'nl';
 return 'world';
}
function newsDate(a){const d=Date.parse(a?.when||'');return Number.isFinite(d)?d:-Infinity}
function storyDate(s){return Math.max(-Infinity,...(s?.articles||[]).map(newsDate))}
function newestFirst(a,b){const da=storyDate(a),db=storyDate(b);return (Number.isFinite(db)?db:0)-(Number.isFinite(da)?da:0)||String(a.title).localeCompare(String(b.title))}
function normalizeArticles(arr){let seen=new Set();return arr.map((a,i)=>{let url=safeURL(a.url),title=(a.title||'').trim(),domain=(a.domain||a.source||'').toLowerCase(),when=a.when||a.published||a.seendate||null;let d=when&&/^\d{8}T\d{6}Z$/.test(when)?`${when.slice(0,4)}-${when.slice(4,6)}-${when.slice(6,8)}T${when.slice(9,11)}:${when.slice(11,13)}:${when.slice(13,15)}Z`:when;return {...a,id:a.id||url||'article-'+i,title,url,domain,when:d&&Number.isFinite(+new Date(d))?new Date(d).toISOString():null,kind:contentType(title),topic:storyTopic(title),region:classifyNewsRegion(title,a.discovery||'',a.region||null)}}).filter(a=>{let key=a.url||a.domain+'|'+a.title.toLowerCase();if(!a.title||seen.has(key))return false;seen.add(key);return true})}
function clusterArticles(articles){
 const engine=window.OpenLensStoryClusters;
 // If the clustering module cannot load, never revert to unsafe broad headline matching.
 const buckets=engine?.group?.(articles,{limit:185})||
  [...articles].sort((a,b)=>newsDate(b)-newsDate(a)).slice(0,185)
  .map(a=>({articles:[a],confidence:'single',score:null,
   detail:'Meertalige matchcontrole niet beschikbaar; artikelen worden niet automatisch samengevoegd.'}));
 return buckets.map(g=>{
  const ats=[...g.articles].sort((a,b)=>newsDate(b)-newsDate(a));
  const headline=[...ats].sort((a,b)=>b.title.length-a.title.length)[0];
  const names=new Set(ats.map(a=>sourceInfo(a).name));
  const confidence=g.confidence||'single',score=g.score??null;
  return {
   id:'live-'+simpleHash(ats.map(a=>a.id).sort().join('|')),
   title:headline.title,topic:storyTopic(headline.title),
   region:classifyNewsRegion(headline.title,'',null,state.feedTopic||state.topic),
   description:g.detail||'Deze koppen zijn nog niet inhoudelijk met elkaar vergeleken.',
   articles:ats,match:confidence==='strong'?'Sterke kopovereenkomst · onbevestigd':
    confidence==='tentative'?'Voorlopige kopovereenkomst · onbevestigd':'Los bericht · geen gekoppelde tweede kop',
   clustering:{confidence,score,version:engine?.version||'unavailable',
    method:g.method||'Geen automatische clustering beschikbaar',
    detail:g.detail||'Artikel niet automatisch gekoppeld',verified:false,
    publishers:names.size,articles:ats.length},
   demo:false,terms:[]
  };
 }).sort(newestFirst).slice(0,185)
}
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h).toString(36)}
function setArticles(articles,mode,feedTopic=state.topic){state.allArticles=normalizeArticles(articles);state.feedTopic=feedTopic;let links=state.allArticles.map(a=>a.url).filter(Boolean);let old=new Set(state.seenLinks);state.lastNewCount=old.size?links.filter(x=>!old.has(x)).length:null;state.seenLinks=[...new Set([...links,...state.seenLinks])].slice(0,2400);state.history.unshift({at:new Date().toISOString(),items:state.allArticles.length,newLinks:state.lastNewCount});state.history=state.history.slice(0,45);state.stories=clusterArticles(state.allArticles);state.mode=mode;state.lastFetched=new Date().toISOString();if(!state.stories.some(x=>x.id===state.selected))state.selected=state.stories[0]?.id||null;persist();render()}

function filterStories(){let result=state.stories.filter(s=>{if(state.topic!=='all'&&state.feedTopic!==state.topic&&s.topic.toLowerCase()!==state.topic)return false;if(state.feedTopic===state.topic){

}if(state.search){let q=state.search.toLowerCase();if(!(s.title+' '+s.articles.map(a=>a.title+' '+sourceInfo(a).name).join(' ')).toLowerCase().includes(q))return false}return filteredArticles(s).length>0});return result.sort(newestFirst)}
function filteredArticles(s){return s.articles.filter(a=>{let o=sourceInfo(a).name;if(state.outlet!=='all'&&o!==state.outlet)return false;if(state.country!=='all'&&state.mode==='live'&&a.country&&a.country.toLowerCase()!==state.country.toLowerCase())return false;if(state.language!=='all'&&state.mode==='live'&&a.language&&a.language.toLowerCase()!==state.language.toLowerCase())return false;if(state.period!=='all'&&state.mode==='live'&&a.when&&(Date.now()-Date.parse(a.when)>Number(state.period)*86400000))return false;return true}).sort((a,b)=>newsDate(b)-newsDate(a))}

function filterSection(){let outlets=[...new Set(state.stories.flatMap(s=>s.articles.map(a=>sourceInfo(a).name)))].sort();let options=(items,selected)=>items.map(([value,label])=>`<option value="${ESC(value)}" ${String(value)===selected?'selected':''}>${ESC(label)}</option>`).join('');return `<div class="filterbar"><label class="search-box" aria-label="Search stories">${icon.search}<input id="searchInput" placeholder="Search headlines, topics, outlets..." value="${ESC(state.search)}" autocomplete="off"></label><select class="filter" id="topicFilter" aria-label="Filter by topic">${options([["all","All news · Dutch & Europe"],["netherlands","Netherlands in focus"],["dutch-politics","Dutch national politics"],["eu-policy","EU policy & regulation"],["eu-institutions","EU institutions"],["migration","Asylum & migration"],["housing","Housing & rent"],["public-finances","Tax & public finances"],["labor","Jobs, labour & pensions"],["healthcare-nl","Dutch healthcare"],["education","Education & universities"],["social-policy","Social policy"],["agriculture","Agriculture & nitrogen"],["climate-energy","Energy transition & grid"],["mobility","Transport & infrastructure"],["digital-policy","Digital policy & AI"],["local-government","Municipalities & provinces"],["rule-of-law","Rule of law & courts"],["security-defense","Defence & security"],["belgium-benelux","Belgium & Benelux"],["gaza","Gaza"],["ukraine","Ukraine"],["geopolitics","Geopolitics"],["middle-east","Middle East"],["world","World"],["politics","Global politics"],["europe","European news"],["business","Economy & business"],["technology","Technology"],["climate","Climate"],["health","Health"]],state.topic)}</select><select class="filter" id="countryFilter" aria-label="Filter by publisher country">${options([['all','All countries'],['Netherlands','Netherlands'],['United States','United States'],['United Kingdom','United Kingdom'],['Germany','Germany'],['France','France'],['India','India'],['Canada','Canada'],['Australia','Australia'],['Qatar','Qatar']],state.country)}</select><select class="filter" id="languageFilter" aria-label="Filter by source language">${options([['all','All languages'],['English','English'],['Dutch','Dutch'],['German','German'],['French','French'],['Spanish','Spanish'],['Arabic','Arabic']],state.language)}</select><select class="filter" id="outletFilter" aria-label="Filter by outlet">${options([['all','All outlets'],...outlets.map(o=>[o,o])],state.outlet)}</select><select class="filter" id="periodFilter" aria-label="Filter by date">${options([['1','Past 24h'],['7','Past 7 days'],['30','Past 30 days'],['all','Any date']],state.period)}</select></div>`}
function statsSection(){let ss=filterStories(),articles=ss.flatMap(s=>filteredArticles(s));let unresolved=state.claims.filter(c=>c.status==='Unresolved').length;return `<div class="stats"><div class="stat"><div class="stat-label">Stories in view ${icon.layers}</div><div class="stat-value">${ss.length}</div><div class="sub">${state.mode==='demo'?'Illustrative scenarios':state.lastNewCount===null?'First live sample':state.lastNewCount+' new links in this fetch'}</div></div><div class="stat"><div class="stat-label">Publisher names ${icon.layers}</div><div class="stat-value">${sourcesCount(ss)}</div><div class="sub">Not a measure of full coverage</div></div><div class="stat"><div class="stat-label">Saved for later ${icon.bookmark}</div><div class="stat-value">${state.saved.length}</div><div class="sub">Stored on this device</div></div><div class="stat"><div class="stat-label">Open questions ${icon.alert}</div><div class="stat-value">${unresolved}</div><div class="sub">Manually tracked claims</div></div></div>`}
function storyCard(s){let a=filteredArticles(s),count=new Set(a.map(x=>sourceInfo(x).name)).size;return `<article class="story-card ${current()?.id===s.id?'selected':''}" data-story="${ESC(s.id)}" tabindex="0" role="button" aria-label="Compare story: ${ESC(s.title)}"><div class="story-overline"><span class="tag ${s.demo?'amber':'blue'}">${s.demo?'EXAMPLE':ESC(s.topic.toUpperCase())}</span><span>${s.demo?ESC(s.topic):ESC(s.match)}</span></div><button class="save-card ${getSaved(s)?'saved':''}" data-action="save" data-id="${ESC(s.id)}" aria-label="${getSaved(s)?'Remove saved story':'Save story'}" title="Save story">${icon.bookmark}</button><h4>${ESC(s.title)}</h4><div class="preview">${ESC(s.description||'')}</div><div class="story-meta"><div class="outlet-stack">${a.slice(0,3).map(x=>`<span class="outlet-mini" title="${ESC(sourceInfo(x).name)}">${ESC(sourceInfo(x).name.slice(0,1))}</span>`).join('')}</div><span>${count} outlet${count===1?'':'s'}</span><span>·</span><span>${a.length} article${a.length===1?'':'s'}</span><span>·</span><span>${s.demo?'Demo':relative(a[0]?.when)}</span></div></article>`}
function storyList(){let list=filterStories();return `<section class="panel"><div class="panel-head"><h3>Stories to compare</h3><span class="subtle">${list.length} results</span></div><div class="story-list">${list.length?list.map(storyCard).join(''):`<div class="empty">${icon.search}<strong>No matching stories</strong><p>Try changing a filter or refresh the live feed.</p>${btn('Clear filters','clear')}</div>`}</div></section>`}
function sharedTerms(articles){if(articles.length<2)return {shared:[],distinct:[]};let counts=new Map();let termsByOutlet=new Map();articles.forEach(a=>{let n=sourceInfo(a).name;let t=termsByOutlet.get(n)||new Set();tokens(a.title).forEach(x=>t.add(x));termsByOutlet.set(n,t)});termsByOutlet.forEach(ts=>ts.forEach(t=>counts.set(t,(counts.get(t)||0)+1)));let sorted=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));return {shared:sorted.filter(x=>x[1]>=2).slice(0,9),distinct:sorted.filter(x=>x[1]===1).slice(0,12)}}
function coverageRow(a){let o=sourceInfo(a),c=a.kind;let p=c==='Opinion signal'?'amber':c==='Analysis signal'?'blue':'';let readableTime=a.demo?'Example date':a.dateType==='feed_pubdate'?`Feed published · ${timeFmt(a.when)}`:`Indexed · ${timeFmt(a.when)}`;return `<article class="coverage-row"><div class="coverage-top"><div class="outlet-identity"><div class="outlet-logo">${ESC(o.name.slice(0,2).toUpperCase())}</div><div><div class="outlet-name">${ESC(o.name)}</div><div class="outlet-sub">${ESC(o.kind)}</div></div></div><span class="tag ${p}">${ESC(c)}</span></div><h4>${link(a.url,ESC(a.title))}</h4><div class="coverage-footer"><span>${readableTime} · ${ESC(a.language||'Language unknown')}</span>${a.url?link(a.url,'Open source '+icon.external):'<span>Illustrative example — no source URL</span>'}</div></article>`}
function comparisonDetail(s){if(!s)return `<section class="panel"><div class="empty">${icon.layers}<strong>Select a story</strong><p>Choose a headline to explore its available source coverage.</p></div></section>`;let articles=filteredArticles(s);let count=new Set(articles.map(a=>sourceInfo(a).name)).size;return `<div class="detail"><section class="panel"><div class="detail-top"><div class="eyeline"><span class="tag ${s.demo?'amber':'blue'}">${s.demo?'ILLUSTRATIVE SCENARIO':ESC(s.topic.toUpperCase())}</span><button class="btn icon-btn ${getSaved(s)?'on':''}" data-action="save" data-id="${ESC(s.id)}" title="Save story" aria-label="Save story">${icon.bookmark}</button></div><h2>${ESC(s.title)}</h2><p class="lede">${ESC(s.description)}</p><div class="context-row"><span>${icon.layers} ${count} distinct outlet${count===1?'':'s'}</span><span>${icon.clock} ${s.demo?'Demo timestamps':(articles.length?timeFmt(articles[0].when):'No date')}</span><span>${icon.info} ${ESC(s.match)}</span></div></div><div class="signal-note">${icon.info}<span>${s.demo?'Demo data: all publishers and headlines below are fictional. Refresh for sourced coverage.':'Matches are produced from similar headlines. Similarity does not establish a common event or prove factual agreement. Publication timestamps may be unavailable; indexed dates are not publication dates.'}</span></div></section><section class="panel"><div class="panel-head"><h3>Compare reporting</h3><span class="subtle">${articles.length} available article${articles.length===1?'':'s'}</span></div><div class="coverage-layout">${articles.slice(0,state.expanded?40:5).map(coverageRow).join('')}${articles.length>5?btn(state.expanded?'Show fewer articles':'Show all '+articles.length+' articles','expand','ghost'):''}${!articles.length?'<p class="fact-explain">No matching articles under these filters.</p>':''}</div></section>${factMatrix(s,articles)}<div class="story-analytics"><section class="panel"><div class="panel-head"><h3>Headline overlap</h3><span class="subtle">Words, not verified facts</span></div><div class="panel-body">${headlineOverlap(articles)}</div></section><section class="panel"><div class="panel-head"><h3>Outlet context</h3><span class="subtle">Ownership ≠ bias score</span></div><div class="panel-body">${outletContext(articles)}</div></section></div><div class="story-analytics"><section class="panel"><div class="panel-head"><h3>Coverage timeline</h3><span class="subtle">${s.demo?'Example events':'Available timestamps'}</span></div><div class="panel-body">${storyTimeline(articles)}</div></section><section class="panel"><div class="panel-head"><h3>Claims to revisit</h3><button class="small-link" data-action="claims">View all</button></div><div class="panel-body">${inlineClaims(s)}</div></section></div></div>`}
function factMatrix(s,articles){let facts=state.facts.filter(f=>f.storyId===s.id),outlets=[...new Set(articles.map(a=>sourceInfo(a).name))];return `<section class="panel"><div class="panel-head"><h3>Evidence / omission review</h3><span class="subtle">Manual, article-level verification</span></div><div class="panel-body"><div class="source-callout">${icon.info}<span>Only label a fact “Not found after review” if you checked the article itself. An absent headline term is not evidence of omission. Your review decisions are stored locally and not independently validated.</span></div>${facts.map(f=>`<div class="fact-card"><div class="fact-title"><strong>${ESC(f.text)}</strong><button data-action="deleteFact:${ESC(f.id)}" class="small-link" title="Remove review item">Remove</button></div>${outlets.length?outlets.map(o=>{let v=f.review[o]?.status||'Not reviewed';return `<div class="fact-outlet"><span>${ESC(o)}</span><select aria-label="Fact review for ${ESC(o)}" data-fact-status="${ESC(f.id)}" data-outlet="${ESC(o)}">${['Not reviewed','Found in article','Not found after review','Contradicted in article','Unclear / disputed'].map(opt=>`<option ${opt===v?'selected':''}>${opt}</option>`).join('')}</select></div>`}).join(''):'<p class="fact-explain">No source available under current filters.</p>'}<div class="fact-meta">Last edited ${timeFmt(f.updated)} · Classification reflects your own reading.</div></div>`).join('')}${!facts.length?'<p class="fact-explain">No verified fact comparisons yet. Add a question or specific factual proposition to review across sources.</p>':''}<form class="inline-entry" data-form="addFact"><input type="hidden" name="storyId" value="${ESC(s.id)}"><input name="text" maxlength="260" required placeholder="Fact or proposition to compare across articles..."><button class="btn primary" type="submit">Add fact</button></form></div></section>`}
function headlineOverlap(articles){let {shared,distinct}=sharedTerms(articles),n=new Set(articles.map(a=>sourceInfo(a).name)).size;if(n<2)return `<div class="empty" style="padding:8px">${icon.info}<strong>More sources needed</strong><p>One outlet is not enough to compare wording.</p></div>`;return `<p class="fact-explain">Terms used in multiple sampled headlines</p><div class="token-chips">${shared.length?shared.map(([t,c])=>`<span class="chip">${ESC(t)} <strong>${c}/${n}</strong></span>`).join(''):'<span class="chip">No reliably shared terms</span>'}</div><p class="fact-explain" style="margin-top:18px">Terms visible in just one outlet's headline</p><div class="token-chips">${distinct.slice(0,8).map(([t])=>`<span class="chip">${ESC(t)}</span>`).join('')||'<span class="chip">None identified</span>'}</div><p class="muted-note">A term absent from a headline may still appear in the full article. This is not a list of omitted facts.</p>`}
function outletContext(articles){let sources=[...new Map(articles.map(a=>[sourceInfo(a).name,sourceInfo(a)])).values()];return sources.slice(0,5).map(o=>`<div style="margin-bottom:13px"><div class="analytic-item"><strong>${ESC(o.name)}</strong><span class="pill-outline">Bias: not rated</span></div><div style="font-size:10px;color:#8392a6;line-height:1.5;margin-top:4px">${ESC(o.ownership)} ${o.url?link(o.url,'↗'):''}</div></div>`).join('')+`<p class="muted-note">Ownership data is contextual and may change. Political leaning is deliberately not guessed. Consult multiple independent rating methodologies and primary ownership disclosures before drawing conclusions.</p>`}
function storyTimeline(articles){return articles.slice().sort((a,b)=>(Date.parse(a.when)||0)-(Date.parse(b.when)||0)).slice(-5).map(a=>`<div class="timeline-item"><div class="time">${a.demo?'Example · ':a.dateType==='feed_pubdate'?'Feed date · ':'Indexed · '}${timeFmt(a.when)}</div><div class="event"><strong>${ESC(sourceInfo(a).name)}</strong> · ${ESC(a.title.length>85?a.title.slice(0,82)+'…':a.title)}</div></div>`).join('')?`<div class="timeline">${articles.slice().sort((a,b)=>(Date.parse(a.when)||0)-(Date.parse(b.when)||0)).slice(-5).map(a=>`<div class="timeline-item"><div class="time">${a.demo?'Example · ':a.dateType==='feed_pubdate'?'Feed date · ':'Indexed · '}${timeFmt(a.when)}</div><div class="event"><strong>${ESC(sourceInfo(a).name)}</strong> · ${ESC(a.title.length>85?a.title.slice(0,82)+'…':a.title)}</div></div>`).join('')}</div><p class="muted-note">This is the feed sample timeline, not a complete history of reporting or edits. Updates are only detected when they appear in a new sample.</p>`:'<p class="fact-explain">No dated entries available.</p>'}
function inlineClaims(s){let arr=state.claims.filter(c=>c.storyId===s.id);return `<p class="fact-explain">Manually log open questions. Status changes are not automated fact-checks.</p><div class="claim-list">${arr.slice(0,3).map(c=>`<div class="claim-row"><div class="claim-icon">?</div><div><div class="claim-text">${ESC(c.text)}</div><div class="claim-detail">${ESC(c.status)} · Updated ${dateFmt(c.updated)}</div></div></div>`).join('')}</div><form class="inline-entry" data-form="addClaim"><input type="hidden" name="storyId" value="${ESC(s.id)}"><input name="text" required maxlength="300" placeholder="Track an unresolved claim..."><button type="submit" class="btn primary">Add</button></form>`}
function dashboard(){let list=filterStories();if(state.selected&&!list.some(x=>x.id===state.selected))state.selected=list[0]?.id||null;return headline()+statsSection()+`<div class="section-row"><div><h2>Coverage monitor</h2><p>Browse a story, then inspect the underlying outlet headlines and uncertainty.</p></div><div class="section-tools"><span>${state.mode==='live'?'Live sample':state.mode==='cached'?'Last saved sample':'Demo preview'}</span></div></div>`+filterSection()+`<div class="compare-grid">${storyList()}${comparisonDetail(current())}</div><div class="disclosure">Provider: ${state.mode==='live'?'GDELT / Google News RSS (depending on availability)':state.mode==='cached'?'cached results from a prior live request':'illustrative local sample'}. OpenLens does not independently certify outlet bias, claim validity, or full-article omissions. ${state.lastFetched?'Last refreshed '+timeFmt(state.lastFetched)+'.':''}</div>`}
function savedPage(){return `<h1 class="page-title">Reading list</h1><p class="page-sub">Stories you've saved in this browser. Export a review to keep a copy outside this device.</p><div class="focus-panel"><div class="section-row"><h2>${state.saved.length} saved stories</h2>${btn(icon.download+' Export review','export')}</div><div class="stack">${state.saved.length?state.saved.map(s=>`<article class="saved-item"><div><span class="tag ${s.demo?'amber':'blue'}">${s.demo?'EXAMPLE':ESC(s.topic)}</span><h4 style="margin-top:9px">${ESC(s.title)}</h4><p>${s.articles.length} captured headline${s.articles.length===1?'':'s'} · Saved ${dateFmt(s.savedAt)}</p></div><div class="actions">${btn('Compare','restore:'+s.id,'primary')}${btn('Remove','unsave:'+s.id)}</div></article>`).join(''):`<div class="panel"><div class="empty">${icon.bookmark}<strong>No saved stories yet</strong><p>Use the bookmark icon next to a story to keep it here.</p>${btn('Explore coverage','dashboard','primary')}</div></div>`}</div></div>`}
function claimsPage(){return `<h1 class="page-title">Claim watch</h1><p class="page-sub">A manual log of questions, evidence URLs, and status changes. Open questions remain open until you update them.</p><div class="focus-panel"><form class="claim-editor" data-form="addDetailedClaim"><h3>Add a claim or open question</h3><div class="form-grid"><div><label for="newClaim">What should be checked?</label><input id="newClaim" name="text" class="input" placeholder="e.g. Which source supports this number?" required maxlength="300"></div><div><label for="newStatus">Status</label><select id="newStatus" class="input" name="status"><option>Unresolved</option><option>Supported</option><option>Disputed</option><option>Needs context</option></select></div></div><div class="form-grid"><div><label for="newEvidence">Evidence URL (optional)</label><input id="newEvidence" class="input" name="evidence" type="url" placeholder="https://..."></div><div style="display:flex;align-items:end"><button type="submit" class="btn primary" style="width:100%">Add to watchlist</button></div></div></form><div class="section-row"><h2>Tracked claims (${state.claims.length})</h2>${btn(icon.download+' Export','export')}</div><div class="stack">${state.claims.length?state.claims.slice().reverse().map(c=>`<article class="saved-item"><div style="min-width:0;flex:1"><div class="claim-text" style="font-size:13px">${ESC(c.text)}</div><p style="margin:7px 0">${ESC(c.storyTitle||'Independent claim')} · Updated ${timeFmt(c.updated)} · ${c.history.length} logged version${c.history.length===1?'':'s'}</p>${c.evidence?`<p>${link(c.evidence,'Review linked evidence '+icon.external)}</p>`:''}<div class="claim-action"><select aria-label="Update claim status" data-claim-status="${ESC(c.id)}">${['Unresolved','Supported','Disputed','Needs context'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select><span class="pill-outline">${ESC(c.status)}</span></div><form data-form="claimEvidence" data-id="${ESC(c.id)}" class="inline-entry" style="margin-top:12px"><input name="note" maxlength="300" placeholder="Add update or evidence note" required><button class="btn" type="submit">Log update</button></form><details style="margin-top:9px;color:#8492a4;font-size:11px"><summary>Update history (${c.history.length})</summary>${c.history.slice().reverse().map(h=>`<p><strong>${ESC(h.status)}</strong> · ${timeFmt(h.at)} — ${ESC(h.note||'Status recorded')}</p>`).join('')}</details></div><button class="btn icon-btn" data-action="deleteClaim:${ESC(c.id)}" title="Delete claim" aria-label="Delete claim">×</button></article>`).join(''):`<div class="panel"><div class="empty">${icon.alert}<strong>No claims tracked</strong><p>Add a question to create an evidence log for future daily reviews.</p></div></div>`}</div></div>`}
function methodsPage(){return `<h1 class="page-title">Transparent methodology</h1><p class="page-sub">What the comparison does, what it cannot establish, and where the information comes from.</p><div class="focus-panel"><div class="overview-banner" style="margin-bottom:14px">${icon.info}<div><strong>Evidence before certainty.</strong> OpenLens surfaces differences in the reporting that it can observe. It does not calculate an objective “truth score”, infer political beliefs from a single headline, or state that a missing headline term was omitted from an article.</div></div><div class="method-card"><h3><span class="method-number">01</span> News sources and timestamps</h3><p>Live data comes from GDELT DOC 2.0, which supplies article URLs, headlines, source domains, detected languages, source-country attributions, and an indexing timestamp. If the optional server API is available, Google News RSS can provide headlines, source names, and feed publication dates. The publisher's own page should be checked for its editorial publication and update history.</p><p><strong>Important:</strong> GDELT's <code>seendate</code> is when GDELT indexed/observed a page, <em>not</em> necessarily when the newsroom published it. Google News feed dates are feed metadata and may differ from on-page timestamps. The “country” filter on GDELT refers to the <em>source outlet</em>, not the event location.</p><p>Provider documentation: <a href="https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/" target="_blank" rel="noopener">GDELT DOC 2.0 ↗</a> · <a href="https://news.google.com/" target="_blank" rel="noopener">Google News ↗</a>.</p></div><div class="method-card"><h3><span class="method-number">02</span> Story grouping and matching</h3><p>Article titles are normalized into distinctive words and compared by token overlap. Titles sharing sufficient words may be grouped as <strong>tentatively related</strong>. One headline may describe an entirely different event with similar words, while articles about the same event can use very different phrasing. Grouping is a discovery aid—not a verified story identity or a complete coverage inventory.</p><p>Counts describe only the sampled results. Feed ranking, language, indexing, paywalls and the selected query all affect what appears.</p></div><div class="method-card"><h3><span class="method-number">03</span> Overlap and omission signals</h3><p>The evidence/omission review matrix lets you record a manual full-article check for each source, without promoting those assessments to automated fact-checks. Its entries are self-reported and can be incomplete or mistaken.</p><p>The dashboard reports terms appearing in two or more sampled <strong>headlines</strong>, as well as terms present in only one. Its optional omission summary aggregates your manual article-level checks, without treating an unreviewed proposition as omitted. It does not automatically identify verified facts shared by multiple articles; doing that responsibly requires full-text access, citation-level source extraction, human review, and explicit confidence labels. <strong>Absence in a headline does not mean omission from a story.</strong></p></div><div class="method-card"><h3><span class="method-number">04</span> Outlet ownership and political bias</h3><p>A small, editable registry attaches general ownership context to known publishers, with a link to an organizational source. Corporate structures can change, and funding does not directly determine editorial quality. The optional political-coverage extension displays selected <strong>AllSides Media Bias Ratings™</strong> with direct rating-profile links, reported confidence, and an explicit <strong>Unrated</strong> category for other publishers. Labels mainly refer to online U.S. political reporting, not whether any particular article is true or biased. The extension records the date of review; ratings can later change.</p><p>Useful external frameworks to compare independently: <a href="https://www.allsides.com/media-bias" target="_blank" rel="noopener">AllSides ↗</a> and <a href="https://adfontesmedia.com/" target="_blank" rel="noopener">Ad Fontes Media ↗</a>. These providers can disagree; neither should be treated as an objective ground truth.</p></div><div class="method-card"><h3><span class="method-number">05</span> Reporting, analysis and opinion</h3><p>“Opinion signal” and “Analysis signal” are simple keyword-based labels applied to titles (e.g. “Opinion” or “Explainer”). “Type unknown” means the type is <strong>unknown</strong>, not confirmed straight reporting. Opening the publication and inspecting its own labeling is necessary before drawing conclusions.</p></div><div class="method-card"><h3><span class="method-number">06</span> Following developments over time</h3><p>Timelines show dated items within the currently collected sample. A local refresh log retains the number of retrieved and newly encountered article links (not a census of published stories). Claim watchlists are user-managed; updating a claim is an explicit manual action, not a verified automated fact-check. Bookmarks and claim histories are saved using your browser's local storage and may be lost if the site data is cleared or another device is used. Export reviews regularly to preserve a record.</p></div><div class="method-card"><h3><span class="method-number">07</span> Current limitations and next steps</h3><ul><li>No publisher-full-text ingestion, semantic fact verification, editorial-rating license, or authenticated cross-device sync.</li><li>Live feed coverage is subject to provider rate limits, indexing, ranking and outages. The interface labels offline demonstration scenarios clearly.</li><li>No inference that more articles, stronger language, or negative tone means higher or lower truthfulness.</li><li>For production: add durable server-side snapshots, audited source metadata, deduplicated story IDs, per-claim citations, opt-in alerts, and human-reviewed comparisons.</li></ul></div></div>`}
function render(){let p=state.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===p));$('breadcrumb').textContent=({dashboard:'Overview',saved:'Reading list',claims:'Claim watch',methods:'Methodology'})[p];$('navSaved').textContent=state.saved.length;$('navClaims').textContent=state.claims.filter(c=>c.status==='Unresolved').length;let el=$('sourceMode');el.className='source-mode '+(state.mode==='live'?'live':state.mode==='demo'?'demo':'');$('sourceModeText').textContent=state.mode==='live'?'Live headlines':state.mode==='cached'?'Saved feed':'Demo data';$('topDate').textContent=dateFmt(new Date(),{weekday:'short',month:'short',day:'numeric'});$('content').innerHTML=p==='dashboard'?dashboard():p==='saved'?savedPage():p==='claims'?claimsPage():methodsPage()}
function onClick(e){let view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();scrollTo({top:0,behavior:'smooth'});return}let btn=e.target.closest('[data-action]');if(btn){let a=btn.dataset.action,id=btn.dataset.id;if(a==='refresh'){refreshNews(false);return}if(a==='save'){let s=state.stories.find(x=>x.id===id);if(s){state.saved=getSaved(s)?state.saved.filter(x=>x.id!==s.id):[savedSnapshot(s),...state.saved];persist();render();toast(getSaved(s)?'Saved to reading list.':'Removed from reading list.')}return}if(a==='clear'){state.search='';state.topic='all';state.country='all';state.language='all';state.outlet='all';state.period='7';render();return}if(a==='expand'){state.expanded=!state.expanded;render();return}if(a==='export'){exportReview();return}if(a==='about'){state.view='methods';render();return}if(a==='claims'){state.view='claims';render();return}if(a==='dashboard'){state.view='dashboard';render();return}if(a.startsWith('unsave:')){state.saved=state.saved.filter(x=>x.id!==a.slice(7));persist();render();return}if(a.startsWith('deleteFact:')){state.facts=state.facts.filter(x=>x.id!==a.slice(11));persist();render();return}if(a.startsWith('deleteClaim:')){state.claims=state.claims.filter(x=>x.id!==a.slice(12));persist();render();return}if(a.startsWith('restore:')){let s=state.saved.find(x=>x.id===a.slice(8));if(s){let live=state.stories.find(x=>x.id===s.id);if(!live){let a=s.articles.map((x,i)=>({id:'saved-'+i,title:x.title,source:x.source,domain:x.source,url:x.url,when:x.when,dateType:x.dateType||'indexed',demo:s.demo,kind:contentType(x.title),language:'Unknown',country:null}));state.stories.unshift({id:s.id,title:s.title,topic:s.topic,region:s.region||classifyNewsRegion(s.title),description:'Saved snapshot — historical article set. New sources might not be represented.',articles:a,demo:s.demo,match:'Saved snapshot'})}state.view='dashboard';state.topic='all';state.search='';state.country='all';state.language='all';state.outlet='all';state.period='all';state.selected=s.id;render();scrollTo({top:0,behavior:'smooth'})}return}}let story=e.target.closest('[data-story]');if(story&&!e.target.closest('a,button')){state.selected=story.dataset.story;state.expanded=false;render();if(window.innerWidth<850)setTimeout(()=>document.querySelector('.detail')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}}
function onChange(e){let map={topicFilter:'topic',countryFilter:'country',languageFilter:'language',outletFilter:'outlet',periodFilter:'period'};if(map[e.target.id]){state[map[e.target.id]]=e.target.value;state.selected=null;state.expanded=false;render();if(['topicFilter','countryFilter','languageFilter','periodFilter'].includes(e.target.id))refreshNews(true);return}if(e.target.matches('[data-fact-status]')){let f=state.facts.find(x=>x.id===e.target.dataset.factStatus);if(f){f.review[e.target.dataset.outlet]={status:e.target.value,at:new Date().toISOString()};f.updated=new Date().toISOString();persist();render();toast('Manual evidence review updated.')}return}if(e.target.matches('[data-claim-status]')){let c=state.claims.find(x=>x.id===e.target.dataset.claimStatus);if(c){c.status=e.target.value;c.updated=new Date().toISOString();c.history.push({at:c.updated,status:c.status,note:'Status changed manually'});persist();render();toast('Status updated and logged.')}return}}
let searchTimer=null;function onInput(e){if(e.target.id==='searchInput'){let next=e.target.value;state.search=next;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{let el=$('searchInput'),pos=el?.selectionStart;render();el=$('searchInput');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}},250)}}
function newClaim(text,storyId,status='Unresolved',evidence=''){let s=state.stories.find(x=>x.id===storyId),now=new Date().toISOString();state.claims.push({id:'c-'+now+'-'+Math.random().toString(36).slice(2,7),storyId:storyId||null,storyTitle:s?.title||null,text,status,evidence:safeURL(evidence),created:now,updated:now,history:[{at:now,status,note:'Added manually'}]});persist();render();toast('Claim saved to your watchlist.')}
function onSubmit(e){let f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();let data=new FormData(f),type=f.dataset.form;if(type==='addClaim'||type==='addDetailedClaim'){let text=String(data.get('text')||'').trim();if(text){newClaim(text,String(data.get('storyId')||'')||null,String(data.get('status')||'Unresolved'),String(data.get('evidence')||''))}}if(type==='addFact'){let txt=String(data.get('text')||'').trim(),storyId=String(data.get('storyId')||'');if(txt&&storyId){let now=new Date().toISOString();state.facts.push({id:'f-'+now+'-'+Math.random().toString(36).slice(2,7),storyId,text:txt,review:{},updated:now});persist();render();toast('Evidence review item added.')}return}if(type==='claimEvidence'){let c=state.claims.find(x=>x.id===f.dataset.id),note=String(data.get('note')||'').trim();if(c&&note){c.updated=new Date().toISOString();c.history.push({at:c.updated,status:c.status,note});persist();render();toast('Update recorded.')}}}
function download(text,name,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportReview(){let data={app:'OpenLens',exportedAt:new Date().toISOString(),sourceMode:state.mode,methodology:'Multilingual headline and event matching using entities, places, dates and action checks. Automated links unverified without full article texts.',filters:{topic:state.topic,country:state.country,language:state.language,outlet:state.outlet,period:state.period},saved:state.saved,claims:state.claims,facts:state.facts,fetchHistory:state.history,visibleStories:filterStories().slice(0,30).map(s=>({title:s.title,topic:s.topic,clusterConfidence:s.clustering?.confidence||null,clusterVerified:false,mode:s.demo?'demo':'live',articles:filteredArticles(s).map(a=>({title:a.title,outlet:sourceInfo(a).name,url:a.url,when:a.when,dateType:a.dateType||'indexed'}))}))};download(JSON.stringify(data,null,2),'openlens-review-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Review exported as JSON.')}
const topicQueries={all:'(election OR climate OR economy OR technology OR summit OR parliament)',world:'(diplomacy OR summit OR United Nations)',politics:'(election OR parliament OR minister)',migration:'(migration OR immigration OR asylum OR refugees OR migratie OR asiel)','dutch-politics':'("Tweede Kamer" OR "Nederlandse politiek" OR "Dutch parliament" OR "Dutch government" OR kabinet)',gaza:'(Gaza OR Rafah OR "Gaza Strip")',ukraine:'(Ukraine OR Ukrainian OR Kyiv OR Zelensky)',geopolitics:'(geopolitics OR diplomacy OR sanctions OR "foreign policy" OR "international security")','middle-east':'("Middle East" OR Iran OR Lebanon OR Syria OR Gaza)','eu-policy':'("European Union" OR "European Commission" OR "European Parliament" OR "EU policy")',europe:'(European Union OR European Commission OR Brussels)',business:'(inflation OR economic growth OR trade)',technology:'(artificial intelligence OR semiconductor OR cybersecurity)',climate:'(climate change OR clean energy OR emissions)',health:'(health research OR public health OR medical study)',"netherlands":"(Nederland OR Nederlandse politiek OR overheid OR economie)","eu-institutions":"(\"Europese Commissie\" OR \"Europees Parlement\" OR \"Europese Raad\")","housing":"(woningbouw OR woningtekort OR huurbeleid)","public-finances":"(rijksbegroting OR belastingplan OR koopkracht)","labor":"(arbeidsmarkt OR minimumloon OR pensioenen)","healthcare-nl":"(zorgpremie OR zorgverzekering OR ziekenhuiszorg)","education":"(studiefinanciering OR hoger onderwijs OR lerarentekort)","agriculture":"(stikstof OR landbouw OR boeren)","climate-energy":"(energietransitie OR netcongestie OR energieprijzen)","mobility":"(openbaar vervoer OR spoor OR infrastructuur)","digital-policy":"(\"AI Act\" OR \"digitale overheid\" OR privacywetgeving)","local-government":"(gemeenteraad OR provincies OR gemeentefinanciën)","rule-of-law":"(rechtsstaat OR rechtspraak OR grondrechten)","security-defense":"(NAVO OR defensie OR \"Europese veiligheid\")","social-policy":"(armoede OR sociale zekerheid OR jeugdzorg)","belgium-benelux":"(België OR Vlaanderen OR Benelux)"};
async function refreshNews(silent){if(state.loading){state.pendingRefresh=true;return}const requestedTopic=state.topic,requestedCountry=state.country,requestedLanguage=state.language,requestedPeriod=state.period;state.loading=true;render();let query=topicQueries[state.topic]||topicQueries.all;let errors=[];let articles=[];let fromArchive=false;try{let u='/api/news?'+new URLSearchParams({topic:state.topic,country:state.country,language:state.language,period:state.period}).toString();let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),16000);try{let r=await fetch(u,{signal:ctrl.signal,headers:{Accept:'application/json'}});if(r.ok){let j=await r.json();if(Array.isArray(j.articles)&&j.articles.length)articles=j.articles.map(a=>({...a,kind:contentType(a.title)}))}else errors.push('Server feed unavailable')}catch(err){errors.push('Server feed unavailable')}finally{clearTimeout(timer)}}catch(err){errors.push('Server feed unavailable')}
if(!articles.length){try{let q=query;let countryCodes={Netherlands:'netherlands','United States':'unitedstates','United Kingdom':'unitedkingdom',Germany:'germany',France:'france',India:'india',Canada:'canada',Australia:'australia',Qatar:'qatar'},langCodes={English:'english',Dutch:'dutch',German:'german',French:'french',Spanish:'spanish',Arabic:'arabic'};if(state.country!=='all'&&countryCodes[state.country])q+=' sourcecountry:'+countryCodes[state.country];if(state.language!=='all'&&langCodes[state.language])q+=' sourcelang:'+langCodes[state.language];let u='https://api.gdeltproject.org/api/v2/doc/doc?'+new URLSearchParams({query:q,mode:'artlist',maxrecords:'125',format:'json',sort:'datedesc',timespan:state.period==='1'?'1d':state.period==='30'?'1m':'1w'});let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),14500);try{let r=await fetch(u,{signal:ctrl.signal});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();articles=(j.articles||[]).map(a=>({url:a.url,title:a.title,domain:a.domain,source:a.domain,when:a.seendate,dateType:'indexed',language:a.language||'Unknown',country:a.sourcecountry||null,provider:'GDELT'}))}finally{clearTimeout(timer)}}catch(err){errors.push('GDELT feed unavailable')}}
if(!articles.length&&requestedCountry==='all'&&requestedLanguage==='all'){
 try{
  const archiveUrl='/api/stored-news?'+new URLSearchParams({topic:requestedTopic,period:requestedPeriod}).toString();
  const response=await fetch(archiveUrl,{headers:{Accept:'application/json'}});
  if(response.ok){
   const saved=await response.json();
   if(Array.isArray(saved.articles)&&saved.articles.length){articles=saved.articles;fromArchive=true}
  }
 }catch(err){errors.push('Historical archive unavailable')}
}
state.loading=false;if(state.topic!==requestedTopic||state.country!==requestedCountry||state.language!==requestedLanguage||state.period!==requestedPeriod){state.pendingRefresh=false;return refreshNews(true)}if(articles.length){setArticles(articles,fromArchive?'cached':'live',requestedTopic);if(!silent)toast(fromArchive?`Toont ${articles.length} gearchiveerde koppen (niet live).`:`Loaded ${articles.length} indexed articles. Matching is tentative.`)}else{if(state.allArticles.length){state.mode='cached';render();if(!silent)toast('Live news unavailable; showing a saved sample.')}else{state.stories=demoData();state.mode='demo';state.selected=state.stories[0].id;render();if(!silent)toast('Live feeds unavailable. Showing clearly labeled examples.')}console.warn('OpenLens feeds:',errors.join('; '))}if(state.pendingRefresh||state.topic!==requestedTopic||state.country!==requestedCountry||state.language!==requestedLanguage||state.period!==requestedPeriod){state.pendingRefresh=false;refreshNews(true)}}

 if(state.allArticles?.length){state.stories=clusterArticles(state.allArticles);render()}
});
