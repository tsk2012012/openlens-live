name: Refresh OpenLens publisher evidence
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: openlens-publisher-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect news samples
        run: node scripts/update-publisher-observations.mjs
        env:
          OPENLENS_URL: https://openlens-live.vercel.app
      - name: Commit changed observations
        run: |
          git config user.name "openlens-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publisher-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update rolling publisher evidence sample"
            git push
          fi
